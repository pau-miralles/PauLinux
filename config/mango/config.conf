exec_once=bash ~/.config/mango/autostart.sh

# Window rules
window_rule=is_term:1,app_id:foot # Swallowing
window_rule=is_floating:1,title:^bar$

# Special binds
bind=SUPER+SHIFT,d,spawn_shell,sed -i '/^#\?dim_enable=1/ { s/^#//; t; s/^/#/; }' ~/.nixos-config/config/mango/config.conf
bind=SUPER+SHIFT,b,spawn_shell,sed -i '/^#\?border_px=1/ { s/^#//; t; s/^/#/; }' ~/.nixos-config/config/mango/config.conf
bind=SUPER+SHIFT,a,spawn_shell,sed -i -e '/^#\?cursor_size=48/ { s/^#//; t; s/^/#/; }' -e '/^#\?monitor_rule=name:eDP-1.scale:1.0/ { s/^#//; t; s/^/#/; }' ~/.nixos-config/config/mango/config.conf


# Monitor Configuration
monitor_rule=name:eDP-1,scale:1.5
# monitor_rule=name:DP-3,scale:1.0,x:-400,y:-1080

## # Window effect
## blur=0
## blur_layer=0
## blur_optimized=1
## blur_params_num_passes = 2
## blur_params_radius = 5
## blur_params_noise = 0.02
## blur_params_brightness = 0.9
## blur_params_contrast = 0.9
## blur_params_saturation = 1.2

## shadows = 0
## layer_shadows = 0
## shadow_only_floating = 1
## shadows_size = 10
## shadows_blur = 15
## shadows_position_x = 0
## shadows_position_y = 0
## shadows_color= 0x000000ff

## border_radius=0
## no_radius_when_single=1
## focused_opacity=1.0
## unfocused_opacity=1.0

## dim_enable=0
## dim_focused_color=0x00000000
dim_unfocused_color=0x00000020

# Animation Configuration(support type:zoom,slide, fade)
## animations=1
## layer_animations=1
animation_type_open=fade
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
## animation_fade_in=1
## animation_fade_out=1
## tag_animation_direction=1
## zoom_initial_ratio=0.4
## zoom_end_ratio=0.8
fade_in_begin_opacity=0
fade_out_begin_opacity=1
animation_duration_move=70
animation_duration_open=70
animation_duration_tag=50
animation_duration_close=50
## animation_duration_focus=0
## animation_curve_open=0.46,1.0,0.29,1
## animation_curve_move=0.46,1.0,0.29,1
## animation_curve_tag=0.46,1.0,0.29,1
## animation_curve_close=0.08,0.92,0,1
## animation_curve_focus=0.46,1.0,0.29,1
## animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
## animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=0
scroller_default_proportion=0.7
## scroller_focus_center=0
## scroller_prefer_center=0
## edge_scroller_pointer_focus=1
## edge_scroller_focus_allow_speed=0.0
## scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.65,0.8

# Master-Stack Layout Setting
new_is_master=0
default_master_factor=0.5
## default_master_count=1
## tag_num=9
## smart_gaps=0

## # Dwindle Layout Setting
## dwindle_smart_split=0
## dwindle_drop_simple_split=1
## dwindle_manual_split=0
## dwindle_horizontal_split=1
## dwindle_vertical_split=1
## dwindle_preserve_split=0

# Monocle Layout Setting
## monocle_tab_mode=1
monocle_no_border=1
monocle_no_gap=1
monocle_no_radius=1

tab_bar_height = 0
tab_bar_decorate_fg_color = 0x00000000
tab_bar_decorate_bg_color = 0x00000000
tab_bar_decorate_focus_fg_color = 0x00000000
tab_bar_decorate_focus_bg_color = 0x00000000
tab_bar_decorate_border_color = 0x00000000
tab_bar_decorate_border_width = 0
tab_bar_decorate_corner_radius = 0
tab_bar_decorate_padding_x = 0
tab_bar_decorate_padding_y = 0
tab_bar_decorate_font_desc = "monospace 0"

## # Deck Layout Setting
## deck_tab_mode=1

## # Overview Setting
## hotarea_size=10
## enable_hotarea=0
## hotarea_disable_on_fullscreen=1
## overview_gap_inner=5
## overview_gap_outer=30
## overcircle_center_ratio=0.5
## title_message_bar_height=52
## title_message_bar_gap=20

# Misc
no_border_when_single=1
## axis_bind_apply_timeout=100
## focus_on_activate=1
## idle_inhibit_ignore_visible=0
## idle_inhibit_when_fullscreen=0
## sloppy_focus=1
## warp_cursor=1
## focus_cross_monitor=0
## focus_direction_only_zone_overlap=1
## focus_cross_tag=0
enable_floating_snap=1
## snap_distance=30
## float_full_to_top=0
cursor_size=32
## drag_tile_to_tile=1
## drag_tile_small=1

# keyboard
## repeat_rate=25
## repeat_delay=600
## numlock_on=0
xkb_rules_layout=es

# Trackpad
## # need relogin to make it apply
## disable_trackpad=0
## tap_to_click=1
## tap_and_drag=1
## drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=0
## trackpad_left_handed=0
## trackpad_middle_button_emulation=0
## swipe_min_threshold=1
trackpad_scroll_factor=0.4
trackpad_accel_profile=1
trackpad_accel_speed=0.1

# mouse
## # need relogin to make it apply
## mouse_natural_scrolling=0
mouse_accel_profile=0

# Appearance
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
scratchpad_width_ratio=0.55
scratchpad_height_ratio=0.7
border_px=0
## root_color=0x201b14ff
## border_color=0x444444ff
## drop_color=0x8FBA7C55
## split_color=0xEB441EFF
## focus_color=0xc9b890ff
## maximized_screen_color=0x89aa61ff
## urgent_color=0xad401fff
## scratchpad_color=0x516c93ff
## global_color=0xb153a7ff
## overlay_color=0x14a57cff

## # layout support:
## # tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
## tag_rule=id:1,layout_name:tile
## tag_rule=id:2,layout_name:tile
## tag_rule=id:3,layout_name:tile
## tag_rule=id:4,layout_name:tile
## tag_rule=id:5,layout_name:tile
## tag_rule=id:6,layout_name:tile
## tag_rule=id:7,layout_name:tile
## tag_rule=id:8,layout_name:tile
## tag_rule=id:9,layout_name:tile

# Key Bindings
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config
# menu and terminal
bind=SUPER,Return,spawn,foot
bind=SUPER,d,spawn,rofi -show drun -theme-str "element-icon { size: 1em; } window { width: 35%; }"
# apps & utilities
bind=SUPER,w,spawn,firefox
bind=SUPER,e,spawn,thunar
bind=SUPER,p,spawn,rofi-power
bind=NONE,XF86PowerOff,spawn,rofi-power
bind=SUPER,v,spawn_shell,cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy
bind=CTRL+ALT+SHIFT,c,spawn,rm -fr $HOME/.cache/cliphist/
bind=SUPER,b,spawn,$HOME/.nixos-config/config/cycle-power.sh
bind=SUPER,g,spawn,rofi-wlsunset
bind=SUPER,period,spawn,rofi -show emoji
bind=NONE,XF86AudioMedia,spawn,toggle-theme
# Audio
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioStop,spawn,playerctl stop
# Brightness
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=SUPER,XF86MonBrightnessDown,spawn,brightnessctl --device='*kbd_backlight*' set 10%-
bind=SUPER,XF86MonBrightnessUp,spawn,brightnessctl --device='*kbd_backlight*' set 10%+
# Screenshots
bind=NONE,Print,spawn_shell,grim - | wl-copy
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy
# Rotate Display
bind=CTRL+ALT,Down,spawn_shell,wlr-randr --output eDP-1 --transform normal
bind=CTRL+ALT,Left,spawn_shell,wlr-randr --output eDP-1 --transform 90
bind=CTRL+ALT,Up,spawn_shell,wlr-randr --output eDP-1 --transform 180
bind=CTRL+ALT,Right,spawn_shell,wlr-randr --output eDP-1 --transform 270
# exit
bind=SUPER,q,killclient,

# switch window focus
bind=ALT,Tab,focusstack,next
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right

# move window
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,l,move_client,right

# switch window status
bind=SUPER,Tab,togglejump,
bind=SUPER+SHIFT,f,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,minus,minimized
bind=SUPER,minus,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# Cycle through layouts
circle_layout=vertical_scroller,grid,vertical_grid,center_tile
bind=SUPER,space,switch_layout
# Set specific layout
bind=SUPER,n,setlayout,tile
bind=SUPER,s,setlayout,scroller
bind=SUPER,m,setlayout,monocle

# tag switch
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0
bind=SUPER+SHIFT,5,tagsilent,5,0
bind=SUPER+SHIFT,6,tagsilent,6,0
# toggle tags
bind=SUPER+CTRL,1,toggletag,1
bind=SUPER+CTRL,2,toggletag,2
bind=SUPER+CTRL,3,toggletag,3
bind=SUPER+CTRL,4,toggletag,4
bind=SUPER+CTRL,5,toggletag,5
bind=SUPER+CTRL,6,toggletag,6

# gaps
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1
bind=SUPER+SHIFT,C,togglegaps

# movewin
bind=SUPER+SHIFT,Up,movewin,+0,-50
bind=SUPER+SHIFT,Down,movewin,+0,+50
bind=SUPER+SHIFT,Left,movewin,-50,+0
bind=SUPER+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+CTRL,h,resizewin,-50,+0
bind=SUPER+CTRL,j,resizewin,+0,+50
bind=SUPER+CTRL,k,resizewin,+0,-50
bind=SUPER+CTRL,l,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,right,3,viewprev_have_client
gesturebind=none,left,3,viewnext_have_client
gesturebind=none,up,3,enteroverview
gesturebind=none,down,3,leaveoverview

